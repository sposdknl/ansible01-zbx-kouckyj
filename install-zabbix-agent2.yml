---
- name: Install Zabbix Agent via Role
  ansible.builtin.include_role:
    name: community.zabbix.zabbix_agent
  vars:
    zabbix_agent_version: 7.0
    zabbix_agent2: true
    zabbix_agent_hostname: "{{ inventory_hostname }}"   # nebo "bastion"
    zabbix_agent_listenip: "0.0.0.0"
    zabbix_agent_server: "192.168.1.2"
    zabbix_agent_serveractive: "192.168.1.2"
    zabbix_agent_hostmetadata: "spos"

...